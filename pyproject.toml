[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unskip"
version = "1.0.0"
description = "Catch test-suite weakening in your Git diff."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Unskip contributors"}]
dependencies = []
keywords = ["code-review", "git", "testing", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/zcxikingstar-ship-it/unskip"
Issues = "https://github.com/zcxikingstar-ship-it/unskip/issues"
Changelog = "https://github.com/zcxikingstar-ship-it/unskip/blob/main/CHANGELOG.md"

[project.scripts]
unskip = "unskip.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
