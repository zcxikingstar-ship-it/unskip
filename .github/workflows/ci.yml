name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install package
        run: python -m pip install .

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel and sdist
        run: python -m build

      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys; wheel = glob.glob('dist/*.whl')[0];
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheel])"

      - name: Smoke-test installed CLI
        run: >-
          python -c "import subprocess; subprocess.run(['unskip', '--version'],
          check=True)"
